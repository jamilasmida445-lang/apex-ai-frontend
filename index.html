<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex AI Assistant</title>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 450px; height: 70vh; background: #ffffff; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); }
        #header { background: #2563eb; color: white; padding: 16px; font-weight: 600; text-align: center; border-radius: 12px 12px 0 0; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { display: flex; padding: 16px; border-top: 1px solid #e2e8f0; gap: 8px; }
        #user-input { flex: 1; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; outline: none; }
        #send-btn { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Apex Intelligence</div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="How can I help with Apex?">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const API_URL = "https://apex-ai-bot-production-1935.up.railway.app/ask"; 
    const ACCESS_TOKEN = "ApexAgency2024!"; 

    const messagesContainer = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendMessage() {
        const question = userInput.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
    method: 'POST',
    headers: { 
        'Content-Type': 'application/json' // MUST HAVE THIS
    },
    body: JSON.stringify({ 
        question: question, 
        token: "ApexAgency2024!" // MUST MATCH PYTHON EXACTLY
    })
});

            const data = await response.json();
            addMessage(data.answer || "Error: " + data.error, 'bot');
        } catch (error) {
            addMessage("Error: Could not connect to the backend.", 'bot');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
